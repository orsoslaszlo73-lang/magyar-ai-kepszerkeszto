<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magyar AI Képszerkesztő V1</title>
<style>
body{
  font-family:Arial,sans-serif;
  background:#111;
  color:white;
  margin:0;
  padding:20px;
}
h1{text-align:center}
button,input,textarea{
  width:100%;
  padding:14px;
  margin-top:12px;
  box-sizing:border-box;
  font-size:16px;
}
button{
  background:#2563eb;
  color:white;
  border:0;
  border-radius:10px;
  font-weight:bold;
}
textarea{
  height:110px;
  border-radius:10px;
}
#elo{
  width:100%;
  max-height:55vh;
  object-fit:contain;
  margin-top:15px;
  display:none;
}
#status{
  margin-top:15px;
  text-align:center;
}
</style>
</head>

<body>

<h1>Magyar AI Képszerkesztő</h1>

<input type="file" id="kep" accept="image/*">

<img id="elo">

<textarea id="utasitas"
placeholder="Írd le magyarul, mit szeretnél módosítani a képen..."></textarea>

<button id="szerkesztes">
KÉP SZERKESZTÉSE
</button>

<div id="status">V1 készen áll</div>

<script>
const kep = document.getElementById("kep");
const elo = document.getElementById("elo");
const utasitas = document.getElementById("utasitas");
const status = document.getElementById("status");

kep.onchange = function(){
  const fajl = this.files[0];
  if(!fajl) return;

  elo.src = URL.createObjectURL(fajl);
  elo.style.display = "block";
  status.textContent = "Kép betöltve";
};

document.getElementById("szerkesztes").onclick = function(){

  if(!kep.files[0]){
    status.textContent = "Először válassz képet";
    return;
  }

  if(!utasitas.value.trim()){
    status.textContent = "Írd le, mit szeretnél módosítani";
    return;
  }

  status.textContent =
  "Működik. Következő lépés: AI képmotor csatlakoztatása.";
};
</script>

</body>
</html>
